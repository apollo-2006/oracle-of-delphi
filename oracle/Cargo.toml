[workspace]
resolver = "2"
members = ["oracle-ipc", "oracle-core", "oracle-actd"]
# The Tauri desktop shell is its own Cargo project (it pulls webview/GUI system
# deps and only builds on a dev machine, not in CI/sandbox). Keep it out of the
# backend workspace so `cargo build` at the root never tries to compile it.
exclude = ["oracle-shell"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Release profile tuned for a latency-sensitive local daemon: LTO + one codegen
# unit for tighter codegen, symbols stripped. Unwinding is KEPT (not abort) so a
# single panicking tool task is isolated by the dispatcher instead of taking the
# whole assistant down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
schemars = "0.8"
