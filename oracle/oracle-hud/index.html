<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oracle of Delphi</title>
    <style>
      :root {
        --accent: #35c9ff;         /* Oracle system cyan */
        --accent-soft: rgba(53, 201, 255, 0.16);
        --apollo: #f5c451;         /* Apollo gold — sun, prophecy, judgment */
        --apollo-deep: #e8a33d;
        --ok: #57e0a8;
        --warn: #ffb454;
        --err: #ff7a86;
        --bg: #04060c;
        --ink: #e6f0fa;
        --ink-dim: #8aa0b8;
        --ink-faint: #5c7089;
        --hair: rgba(140, 190, 240, 0.10);
        --hair-lit: rgba(140, 200, 255, 0.22);
        --glass: linear-gradient(160deg, rgba(18, 28, 44, 0.72), rgba(9, 15, 26, 0.60));
        --panel-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --font-ui: "Segoe UI", system-ui, -apple-system, "Inter", sans-serif;
        --font-mono: "Cascadia Code", "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
      body {
        font-family: var(--font-ui);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #scene { position: fixed; inset: 0; z-index: 0; }

      /* Depth: a soft vignette + a subtle top glow that reacts to state. */
      #vignette {
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(120% 80% at 50% -10%, rgba(53, 201, 255, 0.10), transparent 60%),
          radial-gradient(140% 120% at 50% 120%, rgba(4, 6, 12, 0.85), transparent 55%);
        transition: background 0.6s ease;
      }
      body[data-state="thinking"] #vignette {
        background:
          radial-gradient(120% 80% at 50% -10%, rgba(245, 196, 81, 0.13), transparent 60%),
          radial-gradient(140% 120% at 50% 120%, rgba(4, 6, 12, 0.85), transparent 55%);
      }
      body[data-state="speaking"] #vignette {
        background:
          radial-gradient(120% 80% at 50% -10%, rgba(87, 224, 168, 0.13), transparent 60%),
          radial-gradient(140% 120% at 50% 120%, rgba(4, 6, 12, 0.85), transparent 55%);
      }

      /* ---------- Top bar / branding ---------- */
      #topbar {
        position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 40;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 26px;
        background: linear-gradient(180deg, rgba(6, 10, 18, 0.66), rgba(6, 10, 18, 0));
        -webkit-user-select: none; user-select: none;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark {
        font-size: 20px; color: var(--apollo);
        text-shadow: 0 0 16px rgba(245, 196, 81, 0.6);
      }
      .brand-name {
        font-size: 13px; letter-spacing: 4px; font-weight: 700; color: var(--ink);
      }
      .brand-sub {
        font-size: 10.5px; letter-spacing: 1.5px; color: var(--ink-faint);
        text-transform: uppercase; margin-top: 2px;
      }
      .state-chip {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
        padding: 7px 14px; border-radius: 999px;
        background: rgba(10, 18, 30, 0.6); border: 1px solid var(--hair);
        color: var(--ink-dim);
        backdrop-filter: blur(10px);
      }
      .state-chip::before {
        content: ""; width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 10px var(--accent);
      }
      .state-chip[data-state="idle"] { color: var(--ink-dim); }
      .state-chip[data-state="thinking"] { color: var(--apollo); }
      .state-chip[data-state="thinking"]::before { background: var(--apollo); box-shadow: 0 0 12px var(--apollo); animation: pulse 1.1s ease-in-out infinite; }
      .state-chip[data-state="tool"] { color: #c9a6ff; }
      .state-chip[data-state="tool"]::before { background: #c9a6ff; box-shadow: 0 0 12px #c9a6ff; animation: pulse 0.9s ease-in-out infinite; }
      .state-chip[data-state="speaking"] { color: var(--ok); }
      .state-chip[data-state="speaking"]::before { background: var(--ok); box-shadow: 0 0 12px var(--ok); animation: pulse 0.7s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

      .topbar-right { display: flex; align-items: center; gap: 10px; }
      /* Wake-word chip: doubles as an at-a-glance "is she listening?" light. */
      .wake-chip {
        display: inline-flex; align-items: center; gap: 7px;
        font-family: var(--font-ui);
        font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
        padding: 7px 13px; border-radius: 999px; cursor: pointer;
        background: rgba(10, 18, 30, 0.6); border: 1px solid var(--hair);
        color: var(--ink-faint);
        backdrop-filter: blur(10px);
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }
      .wake-chip:hover { border-color: var(--hair-lit); color: var(--ink-dim); }
      .wake-chip.on {
        color: var(--accent);
        border-color: rgba(53, 201, 255, 0.35);
        background: var(--accent-soft);
      }
      .wake-chip.on::before {
        content: ""; width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 10px var(--accent);
        animation: pulse 2.4s ease-in-out infinite;
      }

      /* ---------- Glass panels ---------- */
      .panel {
        position: fixed; z-index: 20;
        background: var(--glass);
        border: 1px solid var(--hair);
        border-radius: 16px;
        padding: 16px 18px;
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
        box-shadow: var(--panel-shadow);
      }
      .panel h2 {
        font-size: 10.5px; letter-spacing: 2.5px; text-transform: uppercase;
        color: var(--ink-faint); margin-bottom: 12px; font-weight: 700;
        display: flex; align-items: center; gap: 8px;
      }
      .panel h2::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: var(--apollo); box-shadow: 0 0 8px rgba(245, 196, 81, 0.7);
      }

      #diagnostics { top: 76px; left: 26px; width: 268px; }
      #diagnostics #sys {
        font-family: var(--font-mono); font-size: 12px; line-height: 1.9;
        color: var(--ink-dim); word-spacing: 1px;
      }

      #actionPanel { top: 76px; right: 26px; width: 320px; max-height: 52vh; overflow: hidden; }
      #toollog { display: flex; flex-direction: column; gap: 7px; }
      .tool-line {
        display: flex; align-items: center; gap: 10px;
        font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim);
        padding: 6px 8px; border-radius: 9px;
        background: rgba(10, 18, 30, 0.4); border: 1px solid rgba(140, 190, 240, 0.06);
        animation: slideIn 0.25s ease;
      }
      @keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
      .tool-line .t-name { flex: 1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tool-line .t-pill {
        font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
        padding: 2px 8px; border-radius: 999px;
      }
      .t-pill.started { color: var(--accent); background: var(--accent-soft); }
      .t-pill.done { color: var(--ok); background: rgba(87, 224, 168, 0.14); }
      .t-pill.error { color: var(--err); background: rgba(255, 122, 134, 0.14); }
      .tool-line .t-detail {
        flex-basis: 100%; font-size: 11px; color: var(--ink-faint); line-height: 1.5;
        margin-top: 2px; word-break: break-word;
      }

      /* ---------- Bottom console: conversation card + input bar ---------- */
      #console {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
        z-index: 30; width: min(780px, 94vw);
        display: flex; flex-direction: column; gap: 12px;
      }
      #transcriptPanel {
        position: static; /* inside the flex column */
        padding: 14px 16px; max-height: 44vh; overflow-y: auto;
        display: none; /* revealed once there's a message */
      }
      #transcriptPanel:has(.msg),
      #transcriptPanel:has(#livehint:not(:empty)) { display: block; }
      #chatlog { display: flex; flex-direction: column; gap: 9px; }
      .msg {
        max-width: 88%; padding: 9px 13px; border-radius: 13px;
        font-size: 15px; line-height: 1.5; overflow-wrap: anywhere;
        animation: msgIn 0.18s ease;
      }
      @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      .msg .who {
        display: block; font-size: 9.5px; letter-spacing: 1.5px;
        text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px;
      }
      .msg.user {
        align-self: flex-end; color: var(--ink);
        background: var(--accent-soft); border: 1px solid rgba(53, 201, 255, 0.22);
        border-bottom-right-radius: 4px;
      }
      .msg.pythia {
        align-self: flex-start; color: var(--ink);
        background: rgba(12, 20, 32, 0.6); border: 1px solid var(--hair);
        border-bottom-left-radius: 4px;
      }
      #livehint {
        margin-top: 8px; font-size: 13px; color: var(--ink-faint);
        letter-spacing: 0.2px;
      }
      #livehint:empty { display: none; }

      .inputbar {
        display: flex; align-items: center; gap: 10px;
        background: var(--glass); border: 1px solid var(--hair);
        border-radius: 16px; padding: 8px 8px 8px 6px;
        backdrop-filter: blur(20px) saturate(150%);
        box-shadow: var(--panel-shadow);
      }
      .inputbar:focus-within { border-color: var(--hair-lit); }
      #userInput {
        flex: 1; background: transparent; color: var(--ink);
        border: none; outline: none; font: inherit; font-size: 15px;
        padding: 12px 14px;
      }
      #userInput::placeholder { color: var(--ink-faint); }

      #controls { display: flex; align-items: center; gap: 6px; }
      #controls button {
        display: inline-flex; align-items: center; gap: 7px;
        font-family: var(--font-ui); font-size: 13px; font-weight: 600;
        padding: 10px 14px; border-radius: 11px; cursor: pointer;
        border: 1px solid var(--hair); background: rgba(12, 20, 32, 0.5);
        color: var(--ink-dim); letter-spacing: 0.3px;
        transition: background 0.15s ease, color 0.15s ease, box-shadow 0.2s ease, transform 0.1s ease;
      }
      #controls button:hover { transform: translateY(-1px); color: var(--ink); background: rgba(18, 28, 44, 0.7); }
      #controls button:active { transform: translateY(0); }

      #mic.active {
        color: #04140c; background: linear-gradient(180deg, var(--ok), #38c98d);
        border-color: transparent; box-shadow: 0 0 18px rgba(87, 224, 168, 0.5);
      }
      #speak.active { color: var(--accent); border-color: rgba(53, 201, 255, 0.4); background: var(--accent-soft); }
      #interrupt { color: var(--err); border-color: rgba(255, 122, 134, 0.32); }
      #interrupt:hover { background: rgba(255, 122, 134, 0.16); color: var(--err); }

      #apolloSig {
        position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
        z-index: 5; font-size: 9px; letter-spacing: 4px;
        color: rgba(245, 196, 81, 0.4); text-transform: uppercase;
        pointer-events: none;
      }

      /* thin scrollbars inside panels */
      #actionPanel, #transcriptPanel { scrollbar-width: thin; scrollbar-color: rgba(140,190,240,0.2) transparent; }
      #transcriptPanel::-webkit-scrollbar { width: 6px; }
      #transcriptPanel::-webkit-scrollbar-thumb { background: rgba(140,190,240,0.2); border-radius: 3px; }

      /* ---------- Compact corner mode (wake-word summon) ---------- */
      /* When the shell shrinks the window into the corner, drop the side panels
         and let the conversation fill the small pane. */
      @media (max-width: 720px) {
        #diagnostics, #actionPanel { display: none; }
        #topbar { height: 44px; padding: 0 12px; }
        .brand-sub { display: none; }
        .brand-name { font-size: 10px; letter-spacing: 1.5px; }
        .brand-mark { font-size: 16px; }
        #state { display: none; } /* state is conveyed by the core's color */
        .wake-chip { font-size: 10px; padding: 6px 9px; letter-spacing: 1px; }
        /* Anchor to both edges (no centered fixed width) so it always fits. */
        #console { bottom: 12px; left: 12px; right: 12px; width: auto; transform: none; gap: 8px; }
        #transcriptPanel { max-height: 62vh; padding: 12px; }
        .msg { max-width: 94%; }
        /* Stack the input over its controls so 3 buttons never overflow a
           narrow pane. */
        .inputbar { flex-direction: column; align-items: stretch; padding: 8px; gap: 8px; }
        #userInput { font-size: 14px; padding: 9px 10px; }
        #controls { justify-content: space-between; gap: 6px; }
        #controls button { flex: 1; justify-content: center; padding: 9px 6px; font-size: 11px; gap: 4px; }
        #apolloSig { display: none; }
      }

      /* ================= Apollo Decree modal (unchanged contract) ============ */
      #apolloModal {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(20, 14, 2, 0.55), rgba(2, 3, 6, 0.86));
        backdrop-filter: blur(6px);
        opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
      }
      #apolloModal.visible { opacity: 1; pointer-events: auto; }
      .decree-card {
        width: min(560px, 92vw); text-align: center; padding: 34px 40px 30px;
        background: linear-gradient(180deg, rgba(30, 24, 8, 0.62), rgba(14, 16, 22, 0.62));
        border: 1px solid rgba(245, 196, 81, 0.4);
        border-radius: 20px;
        box-shadow: 0 0 60px rgba(245, 196, 81, 0.18), inset 0 0 40px rgba(245, 196, 81, 0.05);
        backdrop-filter: blur(18px) saturate(150%);
        transform: translateY(14px) scale(0.98);
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #apolloModal.visible .decree-card { transform: translateY(0) scale(1); }
      .decree-emblem { display: flex; justify-content: center; margin-bottom: 6px; }
      .decree-emblem svg { filter: drop-shadow(0 0 12px rgba(245, 196, 81, 0.45)); }
      .sun-rays line { stroke: var(--apollo); stroke-width: 1.4; opacity: 0.85;
        transform-origin: 60px 60px; animation: sunspin 60s linear infinite; }
      .sun-core { fill: var(--apollo); opacity: 0.25; }
      .sun-inner { fill: var(--apollo); }
      .laurel ellipse { fill: rgba(245, 196, 81, 0.75); }
      .lapse-track { fill: none; stroke: rgba(245, 196, 81, 0.15); stroke-width: 2; }
      .lapse-ring { fill: none; stroke: var(--apollo); stroke-width: 2.5;
        stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(245, 196, 81, 0.7)); }
      @keyframes sunspin { to { transform: rotate(360deg); } }
      .decree-kicker {
        font-size: 11px; letter-spacing: 3px; color: var(--apollo);
        text-shadow: 0 0 12px rgba(245, 196, 81, 0.5); margin-top: 4px;
      }
      .decree-title {
        font-size: 24px; font-weight: 600; margin: 10px 0 8px;
        color: #fbe7c4; letter-spacing: 0.5px;
      }
      .decree-sub { font-size: 13px; color: #d7c8a4; line-height: 1.6; margin-bottom: 18px; }
      .decree-sev { color: var(--apollo); font-weight: 700; letter-spacing: 1px; }
      .decree-action {
        font-size: 15px; color: #fff; background: rgba(0, 0, 0, 0.32);
        border: 1px solid rgba(245, 196, 81, 0.25); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 22px; word-break: break-word;
        font-family: var(--font-mono);
      }
      .decree-buttons { display: flex; gap: 14px; justify-content: center; }
      .decree-buttons button {
        flex: 1; max-width: 200px; padding: 13px 10px; border-radius: 12px;
        font: inherit; font-size: 15px; cursor: pointer; letter-spacing: 1px;
        transition: transform 0.1s ease, box-shadow 0.2s ease;
      }
      .decree-buttons button .key {
        opacity: 0.55; font-size: 11px; margin-left: 6px;
        border: 1px solid currentColor; border-radius: 4px; padding: 0 4px;
      }
      .decree-buttons button:hover { transform: translateY(-1px); }
      .sanction {
        background: linear-gradient(180deg, rgba(245, 196, 81, 0.9), rgba(232, 163, 61, 0.9));
        color: #2a1c02; border: 1px solid rgba(245, 196, 81, 0.9);
        box-shadow: 0 0 22px rgba(245, 196, 81, 0.4);
      }
      .sanction:hover { box-shadow: 0 0 30px rgba(245, 196, 81, 0.6); }
      .forbid {
        background: rgba(120, 20, 26, 0.35); color: #ff9aa2;
        border: 1px solid rgba(255, 90, 100, 0.45);
      }
      .forbid:hover { background: rgba(150, 24, 32, 0.5); }

      /* ---------- Native-shell titlebar (Tauri only; hidden elsewhere) ---------- */
      #titlebar { display: none; }
      body.native #titlebar {
        display: flex; align-items: center; justify-content: flex-end;
        position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 60;
        padding: 0 8px; -webkit-app-region: drag; -webkit-user-select: none; user-select: none;
      }
      #winctl { display: flex; gap: 4px; -webkit-app-region: no-drag; }
      #winctl button {
        width: 30px; height: 22px; padding: 0; line-height: 1;
        background: transparent; color: var(--ink-dim);
        border: 1px solid transparent; border-radius: 6px;
        font-size: 13px; cursor: pointer;
      }
      #winctl button:hover { background: rgba(120, 200, 255, 0.14); color: var(--ink); }
      #winClose:hover { background: rgba(255, 80, 90, 0.28); color: #ff9aa2; }
      body.native #topbar { top: 34px; }
      body.native #diagnostics, body.native #actionPanel { top: 110px; }
    </style>
  </head>
  <body>
    <div id="titlebar" data-tauri-drag-region>
      <span id="titlebarName" data-tauri-drag-region></span>
      <div id="winctl">
        <button id="winMin" title="Dismiss to tray">—</button>
        <button id="winClose" title="Hide">✕</button>
      </div>
    </div>

    <canvas id="scene"></canvas>
    <div id="vignette"></div>

    <header id="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <div class="brand-text">
          <div class="brand-name">ORACLE OF DELPHI</div>
          <div class="brand-sub">Pythia · local oracle</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="wake-chip" id="wake" type="button">○ Wake off</button>
        <div class="state-chip" id="state" data-state="idle">idle</div>
      </div>
    </header>

    <aside class="panel" id="diagnostics">
      <h2>System</h2>
      <div id="sys">awaiting the signs…</div>
    </aside>

    <aside class="panel" id="actionPanel">
      <h2>Activity</h2>
      <div id="toollog"></div>
    </aside>

    <section id="console">
      <div class="panel" id="transcriptPanel">
        <div id="chatlog"></div>
        <div id="livehint"></div>
      </div>
      <div class="inputbar">
        <input
          id="userInput"
          type="text"
          placeholder="Speak to the Oracle, and press Enter…"
          autocomplete="off"
        />
        <div id="controls">
          <button id="mic">🎙 Voice</button>
          <button id="speak">🔊 Reply</button>
          <button id="interrupt">◼ Stop</button>
        </div>
      </div>
    </section>

    <div id="apolloSig">under the eye of apollo</div>

    <script>
      (function () {
        var tauri = window.__TAURI__;
        if (!tauri) return;
        document.body.classList.add("native");
        var appWindow = tauri.window.getCurrentWindow();
        var min = document.getElementById("winMin");
        var close = document.getElementById("winClose");
        if (min) min.addEventListener("click", function () { appWindow.minimize(); });
        if (close) close.addEventListener("click", function () { appWindow.hide(); });
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
