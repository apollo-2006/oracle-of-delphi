[package]
name = "oracle-shell"
version = "0.1.0"
edition = "2021"
description = "Oracle of Delphi — the native window (bare tao + wry, no Tauri framework)"

# Bundling produces "Oracle of Delphi.exe".
[[bin]]
name = "oracle-of-delphi"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.45"
global-hotkey = "0.6"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
strip = true
