name: demo

# Builds the HUD in demo mode (the real interface with a scripted gateway in
# place of oracle-core) and publishes it to GitHub Pages.
on:
  push:
    branches: [master]
    paths: ['oracle-v37/oracle-hud/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle-v37/oracle-hud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oracle-v37/oracle-hud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: oracle-v37/oracle-hud/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
