name: CI

# Build, lint and test on all three platforms Oracle of Delphi actually runs on.
#
# Why the matrix is not just ubuntu: large parts of this codebase are behind
# `#[cfg(windows)]` / `#[cfg(unix)]`, and a compiler that never sees a branch
# cannot warn about it. A Linux-only pipeline reported "clippy clean, tests
# passing" while the Windows build carried two warnings, three clippy errors,
# and an `oracle-ipc` test target that did not compile at all -- plus a real
# defect in the OAuth loopback server that only manifests on Windows. Every one
# of those was found by compiling the other platform, not by a new test.
#
# So the point of this workflow is coverage of *targets*, not just of tests.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting `RUSTFLAGS: -D warnings`. Cargo passes RUSTFLAGS to
  # every crate it compiles, dependencies included, so one warning in a
  # third-party crate would fail this pipeline for something nobody here can
  # fix. `cargo clippy -- -D warnings` below is the right tool: it denies rustc's
  # own lints (non_upper_case_globals, unused_imports -- both real findings on
  # Windows) as well as clippy's, and it only lints workspace crates.

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others -- the interesting
      # question is usually "which platforms does this break?"
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        # bash on every runner, Windows included. Keeps one set of commands
        # across the matrix, and sidesteps PowerShell's execution policy
        # refusing to run npm.ps1 ("running scripts is disabled on this
        # system"), which is a real failure mode on a stock Windows box.
        shell: bash
        working-directory: oracle-v37

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oracle-v37/oracle-hud/package-lock.json

      # The HUD MUST be built before any cargo command. oracle-core embeds
      # oracle-hud/dist at compile time via #[derive(RustEmbed)], and dist/ is a
      # build output that is not in the repository, so on a fresh checkout
      # `cargo build` fails with "folder '...oracle-hud/dist' does not exist"
      # followed by three cascading `HudAssets` errors that read like a broken
      # dependency rather than a missing directory.
      - name: Build the HUD (oracle-core embeds its dist/)
        working-directory: oracle-v37/oracle-hud
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Rust toolchain
        run: |
          rustup component add clippy rustfmt
          rustup show
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            oracle-v37/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('oracle-v37/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      # --all-targets so tests and benches are linted too. The oracle-ipc test
      # target that failed to compile on Windows was invisible to a plain
      # `cargo clippy`, which does not build test code.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The setup scripts are the first thing a new machine runs, and a syntax
      # error in one is a bad way to find that out. Cheap to guard.
      - name: Shell scripts parse
        if: runner.os != 'Windows'
        run: bash -n scripts/setup.sh scripts/build_all.sh

      - name: setup.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "setup.ps1 parses clean"

      # scripts/build_all.sh is what both READMEs tell you to run, and it was
      # committed non-executable once already, which made a fresh clone fail at
      # the first instruction it gives.
      - name: build_all.sh is executable
        if: runner.os == 'Linux'
        run: test -x scripts/build_all.sh
