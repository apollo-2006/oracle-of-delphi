[package]
name = "oracle-actd"
version.workspace = true
edition.workspace = true

[lib]
name = "oracle_actd"
path = "src/lib.rs"

[[bin]]
name = "oracle-actd"
path = "src/main.rs"

[dependencies]
oracle-ipc = { path = "../oracle-ipc" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
# PNG encoding for window capture. Pure Rust, no system libs -- the actuator
# daemon is the privileged process, so its dependency surface stays deliberately
# small. Only an encoder is needed here; decoding happens in oracle-core.
png = "0.17"
base64 = "0.22"

# Windows-only: raw Win32 bindings for the actuator PAL (windows/process/input).
# Not built on Linux/CI; compiled on the Windows target.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Dwm",
    # Window capture: GDI device contexts, BitBlt/StretchBlt, DIB sections.
    "Win32_Graphics_Gdi",
] }
# UI Automation (a11y tree read + click) is COM: the higher-level `windows`
# crate gives it proper COM wrappers (refcounting, Result-based errors) that
# raw `windows-sys` cannot. Isolated to the pal::windows::uia submodule.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
