name: CI

on:
  push:
    # This repository's default branch is `master`. When this said `[main]`,
    # the push job matched nothing and CI only ever ran on pull requests --
    # which, for a repo developed by pushing straight to the default branch,
    # meant it never ran at all. Both are listed so a future rename is not a
    # silent regression back to that.
    branches: [master, main]
  pull_request:

jobs:
  rust:
    name: Rust (build + test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  cpp:
    name: C++ audio engine (ALSA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libasound2-dev
      - name: Configure + build (ALSA on)
        run: cmake -B oracle-audio/build -S oracle-audio -DOracle_WITH_ALSA=ON && cmake --build oracle-audio/build -j
      - name: Run tests
        run: ./oracle-audio/build/oracle-audio-tests

  hud:
    name: HUD (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install + typecheck + build
        working-directory: oracle-hud
        run: npm ci || npm install && npm run typecheck && npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t oracle:ci .
      - name: Smoke test (doctor + write-config)
        run: |
          docker run --rm oracle:ci doctor
          docker run --rm oracle:ci write-config /tmp/j.toml

  macos:
    name: macOS (Apple Silicon — build + test + CoreAudio)
    runs-on: macos-14      # arm64 runner; macos-13 is Intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # macOS is the only target where the actd link is a filesystem socket
      # subject to sun_path's 104-byte limit, and the only one where the
      # CoreAudio backend compiles at all. Both were unverified while CI was
      # Linux-only: eight tests failed on a Mac and nothing reported it.
      - name: Test
        run: cargo test --all

      - name: Configure + build (CoreAudio)
        run: |
          cmake -B oracle-audio/build -S oracle-audio -DCMAKE_BUILD_TYPE=Release
          cmake --build oracle-audio/build -j3

      # The test binary prints the backend it selected. Asserting on it catches
      # the failure mode the ALSA option already had once: the platform library
      # links, the #ifdef does not match, and the null backend is built instead
      # -- so capture silently produces a test tone rather than audio.
      - name: Run audio tests and assert the real backend was compiled
        run: |
          ./oracle-audio/build/oracle-audio-tests | tee audio.log
          grep -q "capture backend: coreaudio" audio.log \
            || { echo "::error::CoreAudio backend was not compiled in"; exit 1; }

      - name: The shipped macOS profile must load
        run: cargo run -p oracle-core -- check-config --config deploy/oracle.macos.toml
