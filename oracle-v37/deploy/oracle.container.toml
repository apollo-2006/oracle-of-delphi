# Container/default profile. Uses the mock LLM so the image boots with no GPU
# or model; override llm.backend with a llama-server URL for real inference.

[general]
runtime_dir = "/home/oracle/run"
log_level = "info"

[audio]
sample_rate = 48000
vad_onset_fast = 0.85
vad_release = 0.35
hangover_ms = 200
tts_voice = "kokoro"

[llm]
backend = "mock"
model = "qwen2.5-14b-instruct"
max_tokens = 1024
temperature = 0.7

[memory]
db_path = "/home/oracle/oracle.db"
retrieve_limit = 6

[actd]
socket = "/home/oracle/run/actd.sock"
grant_sensitive = false

[hud]
bind = "0.0.0.0:8770"
token = ""
enabled = true

[agent]
step_budget = 12
