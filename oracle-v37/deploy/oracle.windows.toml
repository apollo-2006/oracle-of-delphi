# Windows-native profile for Oracle of Delphi
# Place at %APPDATA%\oracle\oracle.toml (or pass --config).
# Uses a named pipe for the actd link, the E:\oracle-models store, and the
# specific capture/output devices on this machine.

[general]
# On Windows, a writable per-user runtime dir. %LOCALAPPDATA%\oracle works well.
runtime_dir = "C:\\Users\\apollo\\AppData\\Local\\oracle\\run"
log_level = "info"

[audio]
sample_rate = 48000
vad_onset_fast = 0.85
vad_release = 0.35
hangover_ms = 200
tts_voice = "kokoro"
input_device = "Microphone (Razer Seiren V3 Mini)"
output_device = "Speakers (3- Fosi Audio K5 Pro)"

[llm]
# Point at a local llama-server (Vulkan or ROCm build). See docs/WINDOWS.md.
backend = "http://127.0.0.1:8080"
model = "qwen2.5-14b-instruct-q5_k_m"
max_tokens = 1024
temperature = 0.7
model_dir = "E:\\oracle-models"

# --- The small/vision tier ---
# A second, much smaller model that stays resident and does the work that
# arrives continuously: reading the screen, folding episodes into the knowledge
# graph. The 14B cannot do this -- you will not hold 11 GB all day -- which is
# why there was no continuous background work before this tier existed.
#
# ~2.5 GB at Q4. It is a SECOND llama-server on a SECOND port; sharing 8080 with
# the planner is rejected at config load, because the failure mode otherwise is
# silent (the small tier's requests get answered by the 14B and nothing looks
# wrong except the VRAM).
[llm.small]
enabled = false                      # flip on once the GGUF is downloaded
backend = "http://127.0.0.1:8081"
model = "qwen3-vl-2b-instruct-q4_k_m"
max_tokens = 512
temperature = 0.2                    # this tier indexes; it does not converse
resident = true                      # never idle-unloaded -- that is the point

[memory]
db_path = "C:\\Users\\apollo\\AppData\\Local\\oracle\\oracle.db"
retrieve_limit = 6

# Continuity: retrieve relevant memory into the prompt before planning, and write
# each completed turn back afterwards. Without these, memory is only reachable
# when the model chooses to call memory.recall/remember -- which it rarely does,
# so nothing is stored and nothing is read back.
auto_recall = true
auto_record = true
recall_limit = 5
recall_min_score = 0.15

# --- Semantic retrieval ---
# Without this, memory matches on TOKENS, not meaning: "the borrow checker
# complaint in dispatch.rs" will not retrieve "lifetime error in the dispatcher".
# A llama.cpp sidecar serving BGE-small with --embedding is what lifts that.
#
# Changing `model` renames the vector space, which deliberately makes every
# existing row vector-stale (they stay reachable by keyword). Startup prints how
# many, so a switch is visible rather than felt as "she forgot everything".
[memory.embedder]
enabled = false                      # flip on once the GGUF is downloaded
backend = "http://127.0.0.1:8082"    # a THIRD port; not shared with either LLM
model = "bge-small-en-v1.5"
dim = 384                            # must match the model; a mismatch is refused

# --- The ambient index ---
# Sample the focused window, have the resident vision model read it, and make
# what it saw searchable memory. This is the workload that justifies a local
# GPU: continuous, private, and impossible to hand to a cloud API.
#
# Off by default, deliberately -- an assistant that photographs your screen on a
# timer is something you switch on, not something you discover. Requires
# [llm.small]; config load fails if it is on without a vision tier, because the
# alternative is capturing the screen for nobody to read.
#
# Frames are never written to disk. They live in a bounded in-memory queue, go
# to the model, and are dropped. What persists is the text.
[ambient]
enabled = false
sample_secs = 45              # capture is cheap; the change filter drops most
interpret_poll_secs = 5
max_width = 1024              # what the VLM sees; smaller loses small text
change_threshold = 6          # Hamming distance (0-64) that counts as a new screen
queue_len = 24
interpret_while_active = true # frames exist because you are working; keep up
max_tokens = 120
salience = 0.25               # below a conversation: what you said outranks this
retain_days = 21              # 0 disables expiry

# --- When background work may use the GPU ---
# The gate that makes all of this polite: if another process wants the card,
# the assistant stops. An unknown reading also stops it -- being wrong about a
# free GPU costs you frames in a game; being wrong about a busy one costs a
# late summary.
[workwindow]
after_secs = 900              # idle before DEFERRABLE work starts
foreign_vram_budget_mb = 1024 # a compositor holds a few hundred MB; a game, GBs
own_vram_mb = 3000            # our own resident footprint, not foreign pressure

# --- Consolidation ---
# Lift durable facts out of episodes and into the knowledge graph. kg_node and
# kg_edge have existed since the first commit with nothing writing to them, so
# every fact has lived or died with its episode; this is what populates them.
#
# It is also what makes ambient.retain_days a PROMOTION DEADLINE rather than a
# plain delete: observations are mined, then swept, and the knowledge persists.
# Runs only in the idle work window -- a fact learned an hour late is the same
# fact. Requires [llm.small].
[consolidate]
enabled = false
poll_secs = 300
batch_size = 12               # facts spanning a few entries stay visible together
max_tokens = 400
# Mine screen observations, not just conversation. They are the high-volume
# source with an expiry, so they are the reason this pass exists -- but they are
# also descriptions of windows whose contents other people choose. Set false to
# let the graph learn only from what you said and did.
from_observations = true

[actd]
# Named pipe on Windows (bare name; the daemon prefixes \\.\pipe\).
socket = "oracle-actd"
grant_sensitive = false

[hud]
bind = "127.0.0.1:8770"
token = ""
enabled = true

[agent]
step_budget = 12

# Put the focused window (and a few others) into the prompt each turn, so "close
# this" and "what is this error" have a referent. Needs actd; degrades silently.
screen_context = true
screen_other_windows = 6

# How many recent ambient observations go into the prompt each turn, and how old
# one may be and still count as "current". This is what lets "what am I looking
# at?" be answered from context instead of by calling a browser tool to re-fetch
# a page the vision model already read. Does nothing until [ambient] is on.
screen_observations = 3
observation_max_age_secs = 1800

[google]
# Path to your Google Desktop-app credentials.json. Set this and run
# `oracle-core auth --credentials <path> --account <email>` once; run/repl then
# load the sealed token automatically. Empty = Google disabled.
credentials_path = "E:\\oracle-models\\credentials.json"
# Must match the --account you passed to `auth` (your `auth` run used "default").
account = "default"

# Proactive nudges: Pythia speaking first. No planner runs in this loop -- the
# triggers are plain Rust and the only output is speech.
[proactive]
enabled = false            # opt in; it changes how the assistant behaves
poll_secs = 60
calendar = true
lead_minutes = 10
mail = false
mail_query = "is:unread is:starred"
# Process names to announce when they finish, matched by substring. The trigger
# a cloud assistant cannot have.
watch_processes = []
quiet_from_hour = 22
quiet_until_hour = 8
repeat_after_secs = 21600
max_per_hour = 4

[supervise]
# One-click startup: `oracle-core run` launches these hidden and reaps them when
# it exits, so you never open a terminal. Logs land in
# %APPDATA%\oracle\run\{oracle,llm,actd}.log — check those if something won't start.

# --- Local LLM server ---
# Core launches this hidden on startup. This is your exact working command
# (split GGUF: point -m at the -00001-of-00003 shard; llama loads all three).
# Don't ALSO start llama-server by hand while this is true — two servers fight
# over port 8080 and the second flaps.
autostart_llm = true
llm_program = "E:\\oracle-models\\llama.cpp\\build\\bin\\Release\\llama-server.exe"
llm_args = [
  "-m", "E:\\oracle-models\\qwen2.5-14b-instruct-q5_k_m-00001-of-00003.gguf",
  "--host", "127.0.0.1", "--port", "8080",
  "-ngl", "999",
  # --jinja uses the model's own chat template so llama-server actually injects
  # the tool definitions into the prompt — WITHOUT this, the model never sees its
  # tools and can't call them (it just apologizes and rambles).
  "--jinja",
]

# --- Small/vision tier server ---
# The same llama-server binary, a different model, a different port. Leave
# small_llm_program empty to reuse llm_program above.
autostart_small_llm = false
small_llm_program = ""
small_llm_args = [
  "-m", "E:\\oracle-models\\qwen3-vl-2b-instruct-q4_k_m.gguf",
  "--mmproj", "E:\\oracle-models\\mmproj-qwen3-vl-2b-f16.gguf",
  "--host", "127.0.0.1", "--port", "8081",
  "-ngl", "999",
  # Qwen-VL warns at load that it wants at least 1024 image tokens. It matters
  # here: a 1024x576 frame tokenizes to roughly 180 tokens after 2x2 merging,
  # nowhere near that, and the symptom of starving it is not an error -- it is
  # small text coming back wrong or as "nothing legible", which reads like the
  # index being broken rather than under-resolved.
  "--image-min-tokens", "1024",
  # Context has to fit an image at that budget plus the instruction. 4096 was
  # sized for ~180-token frames and would now be mostly image.
  "-c", "8192",
]
small_llm_ready_timeout_secs = 60

# --- Embedding sidecar ---
# The same llama-server binary again, serving BGE with --embedding on port 8082.
# --pooling mean is what BGE expects; without it the vectors are subtly wrong
# rather than absent, which is the hard kind of wrong to notice.
autostart_embedder = false
embedder_program = ""
embedder_args = [
  "-m", "E:\\oracle-models\\bge-small-en-v1.5-q8_0.gguf",
  "--host", "127.0.0.1", "--port", "8082",
  "--embedding",
  "--pooling", "mean",
  "-ngl", "999",
  # Tiny model, tiny context; it embeds sentences, not conversations.
  "-c", "512",
]

# --- Actuator daemon ---
autostart_actd = true
# Auto-detected next to oracle-core.exe; set only if actd lives elsewhere.
actd_program = ""

# --- The face ---
# Open the HUD in a chromeless app window on startup.
open_window = true
# "edge", "chrome", a full path to a Chromium browser, or "default" for your
# default browser (a normal tab).
browser = "edge"

# --- Idle unload ---
# The model holds ~11GB of VRAM and a desktop assistant is mostly idle. After
# this many seconds without activity the llama-server child is killed; the wake
# word reloads it, starting as soon as you begin speaking. 0 keeps it resident.
#
# This applies to the PLANNER only. The small tier is resident by design and is
# not unloaded with it -- releasing 11 GB and keeping 2.5 GB is the whole trade.
idle_unload_secs = 600
llm_ready_timeout_secs = 180
